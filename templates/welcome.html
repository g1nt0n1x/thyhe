<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Welcome - Thyhe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 mx-auto text-center">
            <h1><i class="bi bi-shield-lock"></i> Welcome to Thyhe</h1>
            <div id="welcome-message" class="mt-4 p-4 rounded" style="background-color:#16213e;"></div>
            <a href="{{ url_for('login') }}" class="btn btn-primary mt-3">Go to Login</a>
        </div>
    </div>
</div>
<script>
// VULN: DOM-based XSS - name parameter written to DOM without sanitization
var params = new URLSearchParams(window.location.search);
var name = params.get('name') || 'Guest';
document.getElementById('welcome-message').innerHTML = '<h3>Hello, ' + name + '!</h3><p>Welcome to Thyhe corporate portal.</p>';
</script>
</body>
</html>
