{% extends "base.html" %}
{% block title %}Reports - Thyhe{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-file-earmark-bar-graph"></i> Report Center</h2>

<div class="row">
    <div class="col-md-4 mb-3">
        <a href="{{ url_for('report_import') }}" class="text-decoration-none">
            <div class="card tool-card">
                <div class="card-body text-center">
                    <i class="bi bi-filetype-xml display-4 text-success"></i>
                    <h5 class="mt-2">XML Import</h5>
                    <p class="text-muted small">Import data from XML</p>
                </div>
            </div>
        </a>
    </div>
    <div class="col-md-4 mb-3">
        <a href="{{ url_for('report_generate') }}" class="text-decoration-none">
            <div class="card tool-card">
                <div class="card-body text-center">
                    <i class="bi bi-file-earmark-code display-4 text-info"></i>
                    <h5 class="mt-2">Template Report</h5>
                    <p class="text-muted small">Generate from template</p>
                </div>
            </div>
        </a>
    </div>
    <div class="col-md-4 mb-3">
        <a href="{{ url_for('email_preview') }}" class="text-decoration-none">
            <div class="card tool-card">
                <div class="card-body text-center">
                    <i class="bi bi-envelope display-4 text-warning"></i>
                    <h5 class="mt-2">Email Preview</h5>
                    <p class="text-muted small">Preview email templates</p>
                </div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
