{% extends "base.html" %}
{% block title %}Edit Profile - Thyhe{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header"><i class="bi bi-pencil"></i> Edit Profile</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('profile_edit') }}">
                    <input type="hidden" name="user_id" value="{{ user['id'] }}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ user['email'] }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="department" value="{{ user['department'] }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea class="form-control" name="bio" rows="4">{{ user['bio'] }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header"><i class="bi bi-image"></i> Upload Avatar</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('upload_avatar') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" class="form-control" name="avatar" accept="image/*">
                        <small class="text-muted">Accepted formats: JPG, PNG, GIF</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Avatar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
