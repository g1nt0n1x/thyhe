{% extends "base.html" %}
{% block title %}MFA Verification - Thyhe{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-card">
        <h3 class="text-center mb-4"><i class="bi bi-shield-check"></i> Two-Factor Authentication</h3>
        <p class="text-muted text-center">Enter the 6-digit code from your authenticator app.</p>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="username" value="{{ username }}">
            <div class="mb-3">
                <label class="form-label">MFA Code</label>
                <input type="text" class="form-control text-center" name="mfa_code" maxlength="6" placeholder="000000" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verify</button>
        </form>
        <p class="text-center mt-3 text-muted small">Authenticating as: <strong>{{ username }}</strong></p>
    </div>
</div>
{% endblock %}
