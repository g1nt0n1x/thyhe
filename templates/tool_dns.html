{% extends "base.html" %}
{% block title %}DNS Lookup - Thyhe{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header"><i class="bi bi-globe"></i> DNS Lookup</div>
            <div class="card-body">
                <form method="POST">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="domain" placeholder="Enter domain name (e.g., example.com)">
                        <button type="submit" class="btn btn-primary">Lookup</button>
                    </div>
                </form>
                {% if result %}
                <pre>{{ result }}</pre>
                {% endif %}
            </div>
        </div>
        <a href="{{ url_for('tools') }}" class="btn btn-outline-light mt-3">Back to Tools</a>
    </div>
</div>
{% endblock %}
