{% extends "base.html" %}
{% block title %}URL Checker - Thyhe{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header"><i class="bi bi-link-45deg"></i> URL Status Checker</div>
            <div class="card-body">
                <form method="POST">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="url" placeholder="Enter URL (e.g., http://example.com)">
                        <button type="submit" class="btn btn-primary">Check</button>
                    </div>
                </form>
                {% if status %}
                <div class="alert alert-{{ 'success' if status == 200 else 'warning' }}">
                    HTTP Status: <strong>{{ status }}</strong>
                </div>
                {% endif %}
                {% if result %}
                <h5>Response Content:</h5>
                <pre>{{ result }}</pre>
                {% endif %}
            </div>
        </div>
        <a href="{{ url_for('tools') }}" class="btn btn-outline-light mt-3">Back to Tools</a>
    </div>
</div>
{% endblock %}
