{% extends "base.html" %}
{% block title %}Compose Message - Thyhe{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header"><i class="bi bi-pencil"></i> Compose Message</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">To</label>
                        <select class="form-select" name="to_user">
                            {% for u in users %}
                            <option value="{{ u['username'] }}">{{ u['username'] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" name="subject" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message Body</label>
                        <textarea class="form-control" name="body" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send</button>
                    <a href="{{ url_for('messages') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
