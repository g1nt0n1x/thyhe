{% extends "base.html" %}
{% block title %}Solutions - Thyhe{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto text-center mt-5">
        <i class="bi bi-lock display-1 text-warning"></i>
        <h2 class="mt-3">Solutions Locked</h2>
        <p class="text-muted mt-3">The solutions page requires an access key.</p>
        <form action="" method="GET" class="mt-4">
            <div class="input-group">
                <input type="text" class="form-control" name="key" placeholder="Enter access key...">
                <button type="submit" class="btn btn-warning">Unlock</button>
            </div>
        </form>
        <p class="text-muted small mt-4">Stuck? Try harder. Or ask your instructor for the key.</p>
    </div>
</div>
{% endblock %}
