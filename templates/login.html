{% extends "base.html" %}
{% block title %}Login - Thyhe{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-card text-center">
        <div class="logo mb-3"><i class="bi bi-shield-lock"></i></div>
        <h2 class="mb-1">Thyhe</h2>
        <p class="text-muted mb-4">Corporate Intranet Portal</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
        </form>
        <div class="d-flex justify-content-between">
            <a href="{{ url_for('register') }}" class="text-info small">Create Account</a>
            <a href="{{ url_for('reset_password') }}" class="text-info small">Forgot Password?</a>
        </div>
        <hr class="border-secondary mt-4">
        <p class="text-muted small mb-1">Thyhe &copy; 2024</p>
    </div>
</div>
{% endblock %}
